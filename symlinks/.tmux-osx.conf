# pbcopy is the only clipboard writer on macOS. With set-clipboard on or
# external, tmux would also forward each copy to Alacritty as OSC 52, and the
# two concurrent NSPasteboard writes race: Alacritty then warns "Unable to store
# text in clipboard: NSPasteboard#writeObjects: returned false". Claude Code
# triggers the same race (pbcopy + tmux load-buffer -w).
set -s set-clipboard off
set -s copy-command "pbcopy"

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-and-cancel "pbcopy"
bind -n DoubleClick1Pane copy-mode -M \; send -X select-word \; send -X copy-pipe-and-cancel "pbcopy"
